ha256:62bd094388a1f97480fd06be349299e721a3488c216c86a2fce9367310594ec3","download_count":17,"created_at":"2026-11-13T22:42:40Z","updated_at":"2026-11-13T22:42:47Z"},{"id":745456992,"node_id":"RA_kwDOSBUdsc4sbsVg","name":"obscura-x86_64-macos.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":69818596,"digest":"sha256:c47383e5b5551e09d2055ee7bdcce788af409fb4394e39bdaf179734df18e829","download_count":21,"created_at":"2026-11-13T22:42:40Z","updated_at":"2026-11-13T22:42:46Z"},{"id":745456998,"node_id":"RA_kwDOSBUdsc4sbsVm","name":"obscura-x86_64-windows-no-render-stealth.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":48396631,"digest":"sha256:5368700eb78f07124c6ddfdc052f257e1ce92cfbc3f3a6c4330ee3558923c88a","download_count":61,"created_at":"2026-11-13T22:42:40Z","updated_at":"2026-11-13T22:42:45Z"},{"id":745456989,"node_id":"RA_kwDOSBUdsc4sbsVd","name":"obscura-x86_64-windows-no-render.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":43814010,"digest":"sha256:a2ac7d8b08e93e3ed31f6f14cc7057d822725d3f55d91fc7992a6f2d3e0ad1b6","download_count":44,"created_at":"2026-11-13T22:42:40Z","updated_at":"2026-11-13T22:42:44Z"},{"id":745456991,"node_id":"RA_kwDOSBUdsc4sbsVf","name":"obscura-x86_64-windows-stealth.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":77011421,"digest":"sha256:ffae5e71cfca0108709b57ad83ce7d6b588eff6a15a43093b0cf867dbd18c867","download_count":227,"created_at":"2026-11-13T22:42:40Z","updated_at":"2026-11-13T22:42:46Z"},{"id":745456995,"node_id":"RA_kwDOSBUdsc4sbsVj","name":"obscura-x86_64-windows.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":72427564,"digest":"sha256:be983b663552e11faf8c1e07696578bad622dbeb48afb9f59036032ca8e97fb3","download_count":482,"created_at":"2026-11-13T22:42:40Z","updated_at":"2026-11-13T22:42:46Z"}],"body":"# v0.2.7\r\n\r\nThis release improves iframe automation, form handling, session history, and browser robustness. It adds opt-in MCP web search, fixes rendering hangs and process aborts, isolates CDP connection storage, and repairs Windows runtime packaging. 87 commits since v0.2.6.\r\n\r\n## Highlights\r\n\r\n• Iframe automation uses the correct document and evaluation world. Child-frame evaluation, remote objects, uploads, and owner-frame metadata now follow the frame that owns them. Playwright iframe locators can resolve their content frames (#1479 (https://github.com/h4ckf0r0day/obscura/pull/1479), #1498 (https://github.com/h4ckf0r0day/obscura/pull/1498), #1502 (https://github.com/h4ckf0r0day/obscura/pull/1502)).\r\n• Back and Forward preserve live document state. Same-document history traversal moves the cursor without duplicating entries or reloading the document. Identical-URL entries remain distinct, and replacements preserve forward history (#1577 (https://github.com/h4ckf0r0day/obscura/pull/1577)).\r\n• Forms, selects, and tables support more existing automation. Native ownership determines which controls belong to a form, which options belong to a select, and which rows and cells belong to a table. Live collections and legacy mutation APIs are implemented (#1485 (https://github.com/h4ckf0r0day/obscura/pull/1485), #1488 (https://github.com/h4ckf0r0day/obscura/pull/1488)).\r\n• Several crash and hang paths are fixed. Grid sizing stops when floating-point redistribution cannot progress. Invalid grid spans, malformed CSS imports, short SVG viewBox values, and deeply nested documents no longer trigger the repaired abort paths.\r\n• MCP gains opt-in web search. The new web_search tool uses Keenable to find pages that agents can then open with browser_navigate. Deep-document and nested-table Markdown extraction also avoid repeated work (#1445 (https://github.com/h4ckf0r0day/obscura/pull/1445), #1493 (https://github.com/h4ckf0r0day/obscura/pull/1493)).\r\n• Windows archives include required runtime dependencies. Packaging resolves and bundles the required Visual C++ runtime DLLs and checks the extracted distribution (#1492 (https://github.com/h4ckf0r0day/obscura/pull/1492)).\r\n\r\n## Behavior changes\r\n\r\n• Noninteractive confirm() now returns false instead of automatically accepting the action. alert() remains nonblocking and prompt() returns null. Client-controlled synchronous dialogs remain unsupported (#1475 (https://github.com/h4ckf0r0day/obscura/pull/1475)).\r\n• Each CDP connection receives an independent copy-on-write localStorage snapshot of the server’s startup profile and a fresh IndexedDB store. Changed localStorage keys merge back into the persistent profile when the connection closes. Embeddable persistent context copies continue sharing their configured live profile stores (#1478 (https://github.com/h4ckf0r0day/obscura/pull/1478)).\r\n\r\n## Security\r\n\r\n• The privileged deno_core bootstrap alias is removed from page and frame globals (#1429 (https://github.com/h4ckf0r0day/obscura/pull/1429)).\r\n• Newly created profile directories use owner-only permissions on Unix. Cookie files use mode 0600, and failed cookie saves produce an error log. Existing directory permissions are preserved; Windows directories inherit their parent’s ACL. Profile contents remain plaintext (#1512 (https://github.com/h4ckf0r0day/obscura/pull/1512), #1549 (https://github.com/h4ckf0r0day/obscura/pull/1549)).\r\n• CDP WebSocket connections accept the endpoint’s own HTTP Origin by default. Other origins require OBSCURA_CDP_ALLOWED_ORIGINS. Native clients without an Origin remain supported, and Host validation and bearer authentication remain enforced (#1501 (https://github.com/h4ckf0r0day/obscura/pull/1501)).\r\n• File uploads validate the target input, node identity, and owning frame before reading local files. Invalid or retired handles return protocol errors. Local file access still requires explicit opt-in (#1477 (https://github.com/h4ckf0r0day/obscura/pull/1477)).\r\n• Imported public-suffix cookies receive exact-host scope instead of being silently discarded. SameSite validation and cookie-prefix restrictions remain enforced (#1550 (https://github.com/h4ckf0r0day/obscura/pull/1550)).\r\n• History URL validation uses the committed document URL rather than a queued Location destination, preventing pending navigation from changing the origin used by history updates (#1577 (https://github.com/h4ckf0r0day/obscura/pull/1577)).\r\n\r\n## CDP and automation\r\n\r\n• Child-frame evaluations and function calls execute in the selected frame’s V8 realm. Remote objects and property-derived handles retain their producing evaluation world. Released, retired, and cross-world handles are rejected instead of being redirected into the main document (#1498 (https://github.com/h4ckf0r0day/obscura/pull/1498)).\r\n• DOM.describeNode and DOM.getOuterHTML preserve remote-node ownership. Frame owner elements report live child frameId metadata through document responses and child-node events (#1479 (https://github.com/h4ckf0r0day/obscura/pull/1479), #1502 (https://github.com/h4ckf0r0day/obscura/pull/1502)).\r\n• DOM selector queries stay within the requested subtree, support :scope, and report invalid selectors and node IDs as protocol errors. Explicit shadow-root queries do not pierce unrelated trees (#1481 (https://github.com/h4ckf0r0day/obscura/pull/1481)).\r\n• Lifecycle subscriptions replay the current document’s completed lifecycle state, allowing clients to attach after loading without waiting for events that already happened (#1418 (https://github.com/h4ckf0r0day/obscura/pull/1418)).\r\n• Page.navigateToHistoryEntry preserves the runtime, history state, and popstate behavior when traversing within the live document (#1577 (https://github.com/h4ckf0r0day/obscura/pull/1577)).\r\n• Discovery requests are routed by their request-target path. Header values, query values, and endpoint prefixes no longer change endpoint selection. Discovery URLs also accept trailing slashes (#1549 (https://github.com/h4ckf0r0day/obscura/pull/1549), #1570 (https://github.com/h4ckf0r0day/obscura/pull/1570)).\r\n\r\n## MCP and extraction\r\n\r\n• Set OBSCURA_WEB_SEARCH=keenable to enable web_search. Enabling it sends search queries to Keenable. The integration supports the public endpoint and optional KEENABLE_API_KEY, with bounded responses and result limits (#1445 (https://github.com/h4ckf0r0day/obscura/pull/1445)).\r\n• Search limits accept integer-valued JSON numbers such as 5.0, while preserving defaults and clamping.\r\n• Markdown extraction bounds recursive traversal and uses an explicit stack for deeper subtrees. Nested tables reuse converted cell output instead of recursively converting the same content again. CLI Markdown output, LP.getMarkdown, and MCP share the repair (#1493 (https://github.com/h4ckf0r0day/obscura/pull/1493)).\r\n• MCP cookie and storage-state imports retain public-suffix host cookies with exact-host delivery (#1550 (https://github.com/h4ckf0r0day/obscura/pull/1550)).\r\n\r\n## Networking and page lifecycle\r\n\r\n• Native GET and POST navigation preserve the initiating document when deriving Origin, Referer, Fetch Metadata, and cookie context. Redirects retain origin/site taint and progressively reduced referrers. Native stealth POST uses the selected stealth transport (#1486 (https://github.com/h4ckf0r0day/obscura/pull/1486)).\r\n• Eligible Last-Modified subresources use age-adjusted heuristic cache freshness, capped at 24 hours. Explicit cache controls and existing bypass rules remain in effect (#1457 (https://github.com/h4ckf0r0day/obscura/pull/1457)).\r\n• Empty HTTP error responses fail navigation instead of reporting a successful empty page (#1366 (https://github.com/h4ckf0r0day/obscura/pull/1366)).\r\n• Classic scripts marked nomodule are skipped (#1525 (https://github.com/h4ckf0r0day/obscura/pull/1525)).\r\n• Nested frame parent chains and message sources preserve browsing-context identity across navigation, removal, and reinsertion. Retired frames cannot alias the main window or an unrelated sibling (#1397 (https://github.com/h4ckf0r0day/obscura/pull/1397), #1504 (https://github.com/h4ckf0r0day/obscura/pull/1504)).\r\n\r\n## DOM, JavaScript, and rendering\r\n\r\n• Custom elements receive connection, disconnection, and observed-attribute reactions during DOM mutations. Attribute and style caches update before callbacks run, including reentrant attribute changes (#1381 (https://github.com/h4ckf0r0day/obscura/pull/1381)).\r\n• Twenty-four previously aliased HTML interfaces gain distinct native wrapper prototypes. Constructor identity, prototype changes, and instanceof behavior no longer leak between unrelated tags (#1482 (https://github.com/h4ckf0r0day/obscura/pull/1482)).\r\n• Tables expose live rows, bodies, section rows, and cell collections, with row/cell indices and insertion/deletion APIs. Native ownership excludes nested tables and foreign namespaces (#1476 (https://github.com/h4ckf0r0day/obscura/pull/1476), #1488 (https://github.com/h4ckf0r0day/obscura/pull/1488)).\r\n• Selects support native indexed access and legacy option APIs. Form submission respects actual control ownership, multiple selections, disabled-control rules, and the activated submit button (#1480 (https://github.com/h4ckf0r0day/obscura/pull/1480), #1485 (https://github.com/h4ckf0r0day/obscura/pull/1485), #1488 (https://github.com/h4ckf0r0day/obscura/pull/1488)).\r\n• Input selection survives assignment of an unchanged value. setRangeText() handles explicit undefined defaults, unsigned offset conversion, and unknown input-type fallback (#1443 (https://github.com/h4ckf0r0day/obscura/pull/1443), #1444 (https://github.com/h4ckf0r0day/obscura/pull/1444)).\r\n• Constructed DocumentFragment objects preserve wrapper identity. Node-ID operations resolve the calling frame’s document (#1544 (https://github.com/h4ckf0r0day/obscura/pull/1544), #1538 (https://github.com/h4ckf0r0day/obscura/pull/1538)).\r\n• HTML serialization correctly escapes textarea/title text and attribute values, preserves namespace prefixes, and handles legacy void elements. Foreign xmlns attributes retain their correct identity (#1511 (https://github.com/h4ckf0r0day/obscura/pull/1511), #1524 (https://github.com/h4ckf0r0day/obscura/pull/1524)).\r\n• Shadow-DOM layout can be retained after unrelated metadata and fixed-size image-source updates. Attribute-dependent generated content invalidates retained layout when its inputs change (#1380 (https://github.com/h4ckf0r0day/obscura/pull/1380)).\r\n• Closed dialogs are hidden through the UA cascade while preserving author display overrides (#1568 (https://github.com/h4ckf0r0day/obscura/pull/1568)).\r\n\r\n## Reliability and runtime performance\r\n\r\n• Grid track redistribution stops when floating-point state cannot progress, fixing a rendering hang (#1473 (https://github.com/h4ckf0r0day/obscura/pull/1473)).\r\n• Invalid zero-span grid placements are ignored. Malformed CSS imports and short SVG viewBox values no longer trigger the repaired panic paths (#1466 (https://github.com/h4ckf0r0day/obscura/pull/1466), #1467 (https://github.com/h4ckf0r0day/obscura/pull/1467)).\r\n• Deep-document parsing bounds nesting without dropping elements or text. CDP connection threads receive additional native stack headroom for layout (#1474 (https://github.com/h4ckf0r0day/obscura/pull/1474)).\r\n• Large PBKDF2 derivations run on bounded, cancellable workers instead of blocking the event loop. Small derivations retain a bounded native fast path (#1469 (https://github.com/h4ckf0r0day/obscura/pull/1469)).\r\n• Repeated select-length reads reuse live option snapshots instead of rebuilding and decoding option lists (#1535 (https://github.com/h4ckf0r0day/obscura/pull/1535)).\r\n• History synchronization transfers only changed URL ranges, uses bounded bookkeeping, and moves native data without a JSON round trip (#1577 (https://github.com/h4ckf0r0day/obscura/pull/1577)).\r\n• Storage remains usable when page code replaces its global constructor (#1500 (https://github.com/h4ckf0r0day/obscura/pull/1500)).\r\n\r\n## Packaging and validation\r\n\r\n• Windows packaging bundles required Visual C++ runtime dependencies and validates extracted archives. Dedicated regression checks cover all four Windows variants (#1492 (https://github.com/h4ckf0r0day/obscura/pull/1492)).\r\n• Scoop installation metadata and Windows installation instructions are corrected (#1454 (https://github.com/h4ckf0r0day/obscura/pull/1454)).\r\n• A native ARM64 validation job covers fontless screenshots and client-disconnect cleanup (#1575 (https://github.com/h4ckf0r0day/obscura/pull/1575)).\r\n• CI preserves the exact release binary before workspace tests can rebuild it with different dependency features. Performance measurements use matching release configurations (#1553 (https://github.com/h4ckf0r0day/obscura/pull/1553)).\r\n• Final main validation passed 2,670 render tests with five existing skips, 1,701 no-render tests with three existing skips, and the stealth networking checks.\r\n• All four release build configurations passed: render, render+stealth, no-render, and no-render+stealth.\r\n• Main passed the complete 33/33 obstacle course.\r\n• The independent performance comparison passed 34 scenarios, with five trials per build and 340 recorded samples.\r\n• The CI-built executable separately passed the Playwright history, raw CDP, frame-position, and cookie-origin reproductions.\r\n• Documentation now uses the repository’s GitHub guides and reflects current CLI and CDP behavior (#1441 (https://github.com/h4ckf0r0day/obscura/pull/1441), #1442 (https://github.com/h4ckf0r0day/obscura/pull/1442)).\r\n\r\n## Contributors\r\n\r\nThanks to @963s, @anirudhqwerty, @Bl0ck154, @coolswood, @dsenften, @flolep2607, @ilya-bogin-keenable, @Johnbjoseph-cybersec, @jpdjere, @Ker102, @Kevsosmooth, @kk376, @lkarlslund, @shahzadaliofficial, and @velinxs for contributions to this release.\r\n\r\nFull Changelog: https://github.com/h4ckf0r0day/obscura/compare/v0.2.6...v0.2.7","reactions":{"total_count":1,"+1":1,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"mentions_count":15}
